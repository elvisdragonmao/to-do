services:
  em-to-do:
    build:
      context: .
    container_name: em-to-do
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      DATABASE_PATH: /app/data/em-to-do.sqlite
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Taipei
      WEB_ROOT: /app/web
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - em-to-do-data:/app/data

volumes:
  em-to-do-data:
